services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  user_service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  flight_service:
    build:
      context: .
      dockerfile: services/flight_service/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  hotel_service:
    build:
      context: .
      dockerfile: services/hotel_service/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  billing_service:
    build:
      context: .
      dockerfile: services/billing_service/Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification_service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    ports:
      - "8005:8005"
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Single-node Kafka broker running in KRaft mode - no Zookeeper container.
  # This node plays both the "broker" role (stores/serves messages) and the
  # "controller" role (tracks cluster metadata: which topics/partitions
  # exist, who the leader is) using Kafka's own Raft implementation instead
  # of a separate Zookeeper ensemble.
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # This node acts as both broker and controller - normal for a single
      # dev node. In a real multi-broker cluster you'd typically dedicate a
      # small odd-numbered set of nodes (e.g. 3) to the controller role.
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is what clients (aiokafka) connect on; CONTROLLER is a
      # separate internal port used only for Raft metadata traffic between
      # nodes - required by KRaft even with a single node.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # "1@kafka:9093" = node id 1 is reachable at kafka:9093 for controller
      # (Raft) traffic. With more controller nodes this would be a
      # comma-separated list, e.g. "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093".
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Replication factor of 1 because there's only one broker - a real
      # cluster would use 3 so a topic survives a single broker going down.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Lets a producer create "booking.created" just by publishing to it,
      # so we don't need a separate topic-creation step for this learning setup.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  mongo_data:
  kafka_data:
  redis_data:
